name: 2prdRSI scan
on:
  schedule:
    - cron: "30 6 * * *"          # every day 06:30 UTC, after the previous session's daily bars are complete
  workflow_dispatch:              # manual run from the Actions tab
permissions:
  contents: write                 # saves watchlist.json, cooldowns.json and sp500_symbols.txt back to the repository
concurrency:
  group: rsi2-state
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy requests lxml
      - run: python scanner.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update 2prdRSI state" && git push)
